<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Josh Rudolph</title>
  <link rel="stylesheet" href="assets/css/main.css" />
</head>
<body>
  <main>
    <h1>Josh Rudolph</h1>
    <hr />
    <p class="subtitle">Computational Biologist</p>
    <nav>
      <a href="https://www.linkedin.com/in/josh-rudolph-8520456b/" target="_blank" rel="noopener">
        LinkedIn <span class="arrow">↗</span>
      </a>
      <a href="https://scholar.google.com/citations?user=OwrKEqcAAAAJ" target="_blank" rel="noopener">
        Google Scholar <span class="arrow">↗</span>
      </a>
      <a href="https://github.com/joshrud/" target="_blank" rel="noopener">
        GitHub <span class="arrow">↗</span>
      </a>

    <section class="dna-section">
      <p class="dna-title" id="dna-title">Generating 1 Mb DNA fragment&hellip;</p>
      <canvas id="dna-canvas"></canvas>
      <div class="section-footer">
        <p class="dna-stats" id="dna-stats">&nbsp;</p>
        <button class="copy-btn" id="copy-dna" disabled>Copy DNA (FASTA)</button>
      </div>
    </section>

    <section class="dna-section">
      <p class="dna-title" id="protein-title">Translating longest ORF&hellip;</p>
      <canvas id="protein-canvas"></canvas>
      <div class="section-footer">
        <div>
          <p class="dna-stats" id="protein-stats">&nbsp;</p>
          <p class="dna-legend" id="protein-legend"></p>
        </div>
        <button class="copy-btn" id="copy-protein" disabled>Copy protein (FASTA)</button>
      </div>
    </section>
  </main>

  <script src="assets/js/dna.js"></script>
</body>
</html>
